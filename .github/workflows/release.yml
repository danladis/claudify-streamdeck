name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Install the plugin's runtime dependencies
        run: npm --prefix com.claudify.agents.sdPlugin/bin ci --omit=dev

      - name: Check the tag matches the manifest
        run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

      - name: Test
        run: npm test

      - name: Validate the plugin
        run: npm run validate

      - name: Pack the plugin
        run: npm run pack

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/com.claudify.agents.streamDeckPlugin \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
